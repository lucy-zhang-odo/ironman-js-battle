<!DOCTYPE html>
<html>
<body>
  <script>
    
    const heroName = "勇者";
    let hp = 100;
    let atk = 20;

    // 方法一:用 + 拼接
    console.log(heroName + " 的 HP: " + hp + " / 攻擊: " + atk);

    // 方法二:用模板字串
    console.log(`${heroName} 的 HP: ${hp} / 攻擊: ${atk}`);

    // 故意用錯引號,看看會怎樣
    console.log("${heroName} 的 HP: ${hp}");
  </script>
</body>
</html>

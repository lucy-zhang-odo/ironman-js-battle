<!DOCTYPE html>
<html>
<head>
<style>
  .danger { color: red; font-weight: bold; }
  .dead   { color: gray; text-decoration: line-through; }
  .revenge-btn {
    background-color: #ff0000; color: #ffffff;
    padding: 10px 20px; font-size: 16px;
  }
  .warning { color: #c00000; font-weight: bold; }
</style>
</head>
<body>
  <h1>勇者 vs 小怪</h1>

  <p>
    <input type="text" id="nameInput" placeholder="輸入勇者名字" maxlength="10">
    <button id="startBtn">出征!</button>
  </p>

  <p id="turnText">回合 1</p>
  <p id="heroHp">勇者 HP: ?</p>
  <p id="enemyHp">小怪 HP: ?</p>
  <p id="log">請先輸入名字</p>
  <button id="attackBtn">攻擊!</button>

  <script>
    // ===== 單一事實來源:整個遊戲的狀態都在這裡 =====
    // 從 Day 17 的四個散落變數(hero / enemy / whipCount / battleStarted)收進一個物件。
    // const 鎖的是「state 這個變數指向誰」,裡面的內容照樣能改(Day 6 驗證過)
    //聽起來就是組成一個字典 想知道現在狀態就從這個字典查 但他不負責邏輯
    //之前的呼叫邏輯都在原有的名稱前加了state. 變成-> state.X.X
    const state = {
      hero:  { name: "勇者", hp: 100, maxHp: 100, atk: 20, def: 5 },
      enemy: { name: "小怪", hp: 60,  maxHp: 60,  atk: 15, def: 3 },
      turn: 1,
      whipCount: 0,
      battleStarted: false,
      isOver: false,
    };

    const nameInput   = document.getElementById("nameInput");
    const startBtn    = document.getElementById("startBtn");
    const turnText    = document.getElementById("turnText");
    const heroHpText  = document.getElementById("heroHp");
    const enemyHpText = document.getElementById("enemyHp");
    const logText     = document.getElementById("log");
    const attackBtn   = document.getElementById("attackBtn");

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function calcDamage(atk, def) {
      const base = Math.max(1, atk - def);
      return Math.max(1, base + randomInt(-3, 3));
    }

    function escapeHtml(str) {
      return str.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function updateScreen() {
      turnText.textContent    = `回合 ${state.turn}`;
      heroHpText.textContent  = `${state.hero.name} HP: ${state.hero.hp}`;
      enemyHpText.textContent = `${state.enemy.name} HP: ${state.enemy.hp}`;

      if (state.enemy.hp <= state.enemy.maxHp * 0.3) {
        enemyHpText.classList.add("danger");
        document.body.style.backgroundColor = "#a89798";
      } else {
        enemyHpText.classList.remove("danger");
      }

      if (state.enemy.hp <= 0) {
        enemyHpText.classList.remove("danger");
        enemyHpText.classList.add("dead");
        document.body.style.backgroundColor = "#000000";
        document.body.style.color = "#ffffff";
      }
    }

    function updateWhipShadow() {
      const parts = ["0 0 0 2px rgba(0, 0, 0, 0.6)"];
      for (let i = 1; i <= state.whipCount; i++) {
        parts.push(`${i * 8}px 0 0 rgba(0, 0, 0, 0.45)`);
      }
      attackBtn.style.boxShadow = parts.join(", ");
    }

    function startGame() {
      const name = nameInput.value.trim();

      if (name === "") {
        logText.textContent = "請先輸入名字!";
        logText.classList.add("warning");
        return;
      }
      if (name.length > 10) {
        logText.textContent = `名字太長了(${name.length} 字),請縮短到 10 字以內`;
        logText.classList.add("warning");
        return;
      }

      logText.classList.remove("warning");
      state.hero.name = name;
      logText.textContent = `勇者 ${state.hero.name} 出征!`;
      updateScreen();
    }

    function attack() {
      if (!state.battleStarted) {
        state.battleStarted = true;
        nameInput.disabled = true;
        startBtn.disabled = true;
      }

      if (state.isOver) {
        state.whipCount = state.whipCount + 1;
        logText.textContent =
          `${state.hero.name}請不要對${state.enemy.name}屍體動手!(第 ${state.whipCount} 下)`;
        document.body.style.backgroundColor = "#ff0000";
        updateWhipShadow();
        console.log("目前狀態:", state);
        return;
      }

      const damage = calcDamage(state.hero.atk, state.enemy.def);
      state.enemy.hp = state.enemy.hp - damage;

      if (state.enemy.hp <= 0) {
        state.enemy.hp = 0;
        state.isOver = true;              // 用狀態旗標判斷結束,不再靠血量推論
        attackBtn.textContent = "鞭屍!!";
        attackBtn.classList.add("revenge-btn");
        updateWhipShadow();
        logText.innerHTML = `<b>${escapeHtml(state.enemy.name)}</b> 被擊敗了!(共 ${state.turn} 回合)`;
      } else {
        logText.innerHTML =
          `<b>${escapeHtml(state.hero.name)}</b> 造成 <span style="color:red">${damage}</span> 點傷害!`;
        state.turn = state.turn + 1;      // 只有戰鬥還在進行才推進回合
      }

      updateScreen();
      console.log("目前狀態:", state);    // 一行看見全貌 但顯示的是最後狀態不是每個階段狀態都表留
    }

    updateScreen();
    startBtn.addEventListener("click", startGame);
    attackBtn.addEventListener("click", attack);
  </script>
</body>
</html>

    // ===================================================================
    // 練習 3:async / await —— 讀起來像同步
    // ===================================================================
    
    function wait(ms, message) {
      return new Promise((resolve) => {
        setTimeout(() => { console.log(message); resolve(); }, ms);
      });
    }

    async function 煮飯() {  //可以直接寫中文嗎?
      console.log("開始煮飯");
      await wait(500, "1. 洗米好了");
      await wait(500, "2. 下鍋了");
      await wait(500, "3. 煮好了");
      await wait(500, "4. 上菜!");
      console.log("全部完成");
    }
    煮飯();
    console.log("← 這行會先出現,因為 await 只暫停函式內部,不卡住外面");
